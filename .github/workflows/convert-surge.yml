name: Build external rule-sets

# Builds binary/ from sources that are NOT hand-written sing-box JSON:
#
#   list.txt  manifest of URLs, each a Surge-format .list. Downloaded and
#             converted to sing-box source JSON by surge2singbox.py, then
#             compiled to binary/<name>.srs where <name> is the .list basename
#             (WeChat.list -> WeChat.srs).
#   asn.txt   manifest of ASN sets. sing-box has no ip_asn rule item, so
#             asn2singbox.py resolves each ASN to its announced prefixes and
#             emits binary/<output-name>.srs. Both manifests land in the same
#             staging dir, so the compile step below needs no special-casing.
#
# Everything here is regenerated from an upstream that moves on its own, which
# is why the daily schedule matters: a frozen prefix list goes stale silently.
#
# This is a DIFFERENT job from compile-rulesets.yml: that one compiles
# hand-written sing-box JSON in source/. Both write binary/ and share the
# 'rulesets-binary' concurrency group so they never push simultaneously.
#
# Triggers: push to either manifest or either script / every 24h / manual.
# The sing-box compiler is pinned to q-core's vendored generation — bump
# SING_BOX_VERSION in lockstep when q-core re-pins (same as compile-rulesets.yml).

on:
  push:
    branches: [main]
    paths:
      - 'list.txt'
      - 'asn.txt'
      # The scripts themselves change what the same manifest produces (e.g. the
      # IP-ASN expansion), so a script edit must rebuild binary/ too.
      - '.github/scripts/surge2singbox.py'
      - '.github/scripts/asn2singbox.py'
      - '.github/workflows/convert-surge.yml'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rulesets-binary
  cancel-in-progress: false

env:
  SING_BOX_VERSION: v1.14.0-alpha.43

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch pinned sing-box (prebuilt release)
        run: |
          set -euo pipefail
          ver="${SING_BOX_VERSION#v}"
          url="https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${ver}-linux-amd64.tar.gz"
          echo "downloading ${url}"
          curl -fsSL "$url" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${ver}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Convert Surge lists -> sing-box source
        run: |
          set -euo pipefail
          python .github/scripts/surge2singbox.py list.txt /tmp/converted

      - name: Expand ASN manifest -> sing-box source
        run: |
          set -euo pipefail
          # Same staging dir as the converter; the compile step picks both up.
          python .github/scripts/asn2singbox.py asn.txt /tmp/converted

      - name: Compile source -> binary
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p binary
          count=0
          for json in /tmp/converted/*.json; do
            name="$(basename "$json" .json)"
            echo "compile ${name}"
            sing-box rule-set compile "$json" -o "binary/${name}.srs"
            count=$((count + 1))
          done
          echo "compiled ${count} Surge rule-set(s)"

      - name: Commit binaries
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A binary
          if git diff --cached --quiet; then
            echo "no rule-set changes to commit"
            exit 0
          fi
          git commit -m "chore(binary): convert Surge rule-sets (sing-box ${SING_BOX_VERSION}) [skip ci]"
          # The sibling workflow may have pushed to binary/ while this run sat in
          # the shared concurrency queue. actions/checkout pins us to the SHA
          # that triggered the run, not to main's tip, so rebase before pushing
          # or the push is rejected as non-fast-forward. The two jobs own
          # disjoint .srs files, so this never conflicts.
          git pull --rebase origin main
          git push
